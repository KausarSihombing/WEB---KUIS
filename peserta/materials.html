<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi — Kuis Bahasa C</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="main">
      <header class="topbar">
        <button class="hamburger" id="sidebarToggle" aria-label="Buka menu"><span></span><span></span><span></span></button>
        <div>
          <h1 id="pageTitle">Materi</h1>
          <div class="sub" id="pageSub">Bahan bacaan dari instruktur</div>
        </div>
        <div class="topbar-actions">
          <a class="btn btn-sm" href="home.html">Beranda</a>
        </div>
      </header>

      <main class="content">
        <div class="page-head">
          <div>
            <h2>Materi Pembelajaran</h2>
            <p>Semua materi yang sudah diterbitkan instruktur.</p>
          </div>
          <div class="page-actions">
            <input class="input" id="searchInput" type="search" placeholder="Cari materi..." style="width:220px" aria-label="Cari materi">
          </div>
        </div>

        <div class="panel">
          <div class="panel-body" id="materialsArea">
            <div class="loading-block"><span class="spinner"></span><span>Memuat materi...</span></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal" id="readerModal">
    <div class="modal-card wide">
      <div class="modal-head">
        <div><h3 id="readerTitle">Materi</h3><p id="readerMeta"></p></div>
        <button class="modal-close" type="button" data-close aria-label="Tutup">&times;</button>
      </div>
      <div class="modal-body">
        <div class="material-content" id="readerBody"></div>
        <div class="mt-3" id="readerFile"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" type="button" data-close>Tutup</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script type="module">
    import { requireAuth } from '../js/auth.js';
    import { sb } from '../js/supabase.js';
    import {
      $, mountShell, toast, escapeHtml, formatDate, sanitizeHtml, safeUrl, openModal,
      emptyState,
    } from '../js/ui.js';

    let materials = [];
    let keyword = '';

    const profile = await requireAuth('peserta');
    if (profile) {
      mountShell({ profile, role: 'peserta', active: 'materials', title: 'Materi', subtitle: 'Bahan bacaan dari instruktur' });
      $('#searchInput').addEventListener('input', (event) => {
        keyword = event.target.value.trim().toLowerCase();
        renderList();
      });
      loadMaterials();
    }

    async function loadMaterials() {
      try {
        const { data, error } = await sb
          .from('materials')
          .select('id, title, description, content, file_url, is_published, created_at')
          .eq('is_published', true)
          .order('created_at', { ascending: false });

        if (error) throw error;
        materials = data ?? [];
        renderList();
      } catch (error) {
        toast(error.message, 'error');
        $('#materialsArea').innerHTML = emptyState('⚠️', 'Gagal memuat materi', error.message);
      }
    }

    function renderList() {
      const rows = keyword
        ? materials.filter((m) => `${m.title} ${m.description ?? ''}`.toLowerCase().includes(keyword))
        : materials;

      if (!materials.length) {
        $('#materialsArea').innerHTML = emptyState('▤', 'Belum ada materi', 'Instruktur belum menerbitkan materi.');
        return;
      }
      if (!rows.length) {
        $('#materialsArea').innerHTML = emptyState('🔍', 'Tidak ditemukan', 'Coba kata kunci lain.');
        return;
      }

      $('#materialsArea').innerHTML = `
        <div class="material-list">
          ${rows.map((m) => `
            <div class="material-item" data-open="${m.id}" role="button" tabindex="0">
              <div class="material-thumb">${m.file_url ? '📄' : '▤'}</div>
              <div style="flex:1;min-width:0">
                <h4>${escapeHtml(m.title)}</h4>
                <p>${escapeHtml(m.description || 'Buka untuk membaca materi.')}</p>
                <div class="meta">
                  <span class="tiny muted">${formatDate(m.created_at, false)}</span>
                  ${m.file_url ? '<span class="badge badge-selesai">Lampiran</span>' : ''}
                </div>
              </div>
              <span class="btn btn-sm btn-soft" style="align-self:center">Baca</span>
            </div>
          `).join('')}
        </div>`;

      $('#materialsArea').querySelectorAll('[data-open]').forEach((card) => {
        const open = () => {
          const material = materials.find((m) => m.id === card.dataset.open);
          if (material) openReader(material);
        };
        card.addEventListener('click', open);
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            open();
          }
        });
      });
    }

    function openReader(material) {
      $('#readerTitle').textContent = material.title;
      $('#readerMeta').textContent = `Diterbitkan ${formatDate(material.created_at, false)}`;
      $('#readerBody').innerHTML = material.content
        ? sanitizeHtml(material.content)
        : `<p class="muted">${escapeHtml(material.description || 'Materi ini belum memiliki isi teks.')}</p>`;
      const fileUrl = safeUrl(material.file_url);
      $('#readerFile').innerHTML = fileUrl
        ? `<a class="btn btn-soft btn-sm" href="${escapeHtml(fileUrl)}" target="_blank" rel="noopener noreferrer">Buka lampiran ↗</a>`
        : '';
      openModal('readerModal');

      if (globalThis.hljs) {
        $('#readerBody').querySelectorAll('pre code').forEach((block) => {
          try { globalThis.hljs.highlightElement(block); } catch { /* abaikan */ }
        });
      }
    }
  </script>
</body>
</html>
