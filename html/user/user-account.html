<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - FreeBuff Quiz</title>
    <link rel="stylesheet" href="../css/user.css">
    
</head>
<body>
    <!-- Banner Utama -->
    <header class="hero-banner">
        <div class="container">
            <h1>Selamat datang di quizz Sibling Solid</h1>
            <p>Kausar Sihombing sebagai Lead Instruktur</p>
        </div>
    </header>

    <!-- Navigasi -->
    <nav class="navbar user-nav">
        <div class="logo">
            <span>FreeBuff Quiz</span>
        </div>
        <ul class="nav-links">
            <li><a href="user-beranda.html">Beranda</a></li>
            <li><a href="user-kuis.html">Kuis</a></li>
            <li><a href="user-tentang.html">Tentang</a></li>
            <li><a href="user-kontak.html">Kontak</a></li>
        </ul>
        <div class="nav-actions">
            <button id="accountBtn" class="btn-account">Account</button>
        </div>
    </nav>

    <!-- Konten Account -->
    <main class="container">
        <section class="account-section">
            <div class="account-card">
                <h2>Profil Saya</h2>
                <div class="account-avatar">
                    <span id="userInitial">US</span>
                </div>
                <div class="account-info" id="accountInfo">
                    <p>Memuat profil...</p>
                </div>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
        </section>
    </main>

    <script>
        // Import supabase config
        import './js/supabase-config.js';
        
        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize auth
            auth.initAuth();
            
            // Get user data
            const user = auth.getCurrentUser();
            const infoDiv = document.getElementById('accountInfo');
            const logoutBtn = document.getElementById('logoutBtn');
            
            if (user) {
                // Fetch user profile from database
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', user.id)
                    .single();
                
                if (data) {
                    document.getElementById('userInitial').textContent = 
                        (data.email || 'U').substring(0, 2).toUpperCase();
                    infoDiv.innerHTML = `
                        <p><strong>Nama:</strong> ${data.email || 'Tidak diketahui'}</p>
                        <p><strong>Email:</strong> ${data.email}</p>
                        <p><strong>Role:</strong> ${data.role || 'user'}</p>
                    `;
                }
            }
            
            // Logout handler
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    auth.handleLogout();
                });
            }
        });
    </script>
</body>
</html>
